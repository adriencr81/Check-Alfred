# Example mandate for a support triage bot.
#
# This example demonstrates `required_actions`: once a ticket is
# classified, it must also be routed in the same trace. Closing tickets
# is intentionally not allowed; uncertain cases must be escalated.

agent: support-triage-bot

# Tools this agent is allowed to use.
allowed_tools:
  - classify_ticket
  - route_ticket
  - escalate_to_human

# Realistic daily operating budget.
daily_budget_eur: 2.50

# The agent must never close tickets directly.
# Uncertain tickets should always be escalated instead.
forbidden_actions:
  - close_ticket

# Escalate if too many tool failures occur or most of the budget
# has already been consumed.
escalate_when:
  - tool_error_rate > 0.10
  - budget_used > 0.80

# A call to this tool is the only accepted proof that the agent
# escalated the case.
escalation_tools:
  - escalate_to_human

# If a ticket is classified, it must also be routed during
# the same trace. Otherwise Alfred reports a
# `required_action_missing` deviation.
required_actions:
  - when_tool: classify_ticket
    require_tool: route_ticket